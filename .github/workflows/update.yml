name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update
        run: |
          python3 <<'PY'
          import base64
          import re
          from pathlib import Path

          # 1. Base translations for the 19 core languages
          translations = {
              "en": (
                  "Your file is downloading..",
                  "If this tool is helping you, please consider supporting.",
                  "Convert Another",
                  "Donate"
              ),
              "fr": (
                  "Votre fichier est en cours de téléchargement..",
                  "Si cet outil vous aide, pensez à nous soutenir.",
                  "Convertir un autre",
                  "Faire un don"
              ),
              "es": (
                  "Tu archivo se está descargando..",
                  "Si esta herramienta te ayuda, considera apoyarnos.",
                  "Convertir otro",
                  "Donar"
              ),
              "de": (
                  "Ihre Datei wird heruntergeladen..",
                  "Wenn Ihnen dieses Tool hilft, unterstützen Sie uns bitte.",
                  "Weiteren konvertieren",
                  "Spenden"
              ),
              "it": (
                  "Il tuo file è in download..",
                  "Se questo strumento ti è utile, valuta di sostenerci.",
                  "Converti un altro",
                  "Dona"
              ),
              "pt": (
                  "Seu arquivo está sendo baixado..",
                  "Se esta ferramenta for útil, por favor, considere nos apoiar.",
                  "Converter outro",
                  "Doar"
              ),
              "ru": (
                  "Ваш файл загружается..",
                  "Если этот инструмент вам помогает, пожалуйста, поддержите нас.",
                  "Конвертировать еще",
                  "Пожертвовать"
              ),
              "ja": (
                  "ファイルのダウンロード中です..",
                  "このツールがお役に立てましたら、サポートをご検討ください。",
                  "別のファイルを変換",
                  "寄付"
              ),
              "ko": (
                  "파일을 다운로드하고 있습니다..",
                  "이 도구가 도움이 되셨다면 후원을 고려해 주세요.",
                  "다른 파일 변환",
                  "기부하기"
              ),
              "zh": (
                  "您的文件正在下载..",
                  "如果此工具对您有帮助，请考虑支持我们。",
                  "转换其他文件",
                  "捐赠"
              ),
              "ar": (
                  "جارٍ تنزيل ملفك..",
                  "إذا كانت هذه الأداة تساعدك، يرجى التفكير في دعمنا.",
                  "تحويل ملف آخر",
                  "تبرع"
              ),
              "hi": (
                  "आपकी फ़ाइल डाउनलोड हो रही है..",
                  "अगर यह टूल आपके काम आ रहा है, तो कृपया हमें समर्थन देने पर विचार करें।",
                  "एक और कनवर्ट करें",
                  "दान करें"
              ),
              "id": (
                  "File Anda sedang diunduh..",
                  "Jika alat ini membantu Anda, mohon pertimbangkan untuk mendukung kami.",
                  "Konversi Lainnya",
                  "Donasi"
              ),
              "tr": (
                  "Dosyanız indiriliyor..",
                  "Bu araç işinize yarıyorsa, lütfen bizi desteklemeyi düşünün.",
                  "Başka Bir Tane Dönüştür",
                  "Bağış Yap"
              ),
              "pl": (
                  "Twój plik jest pobierany..",
                  "Jeśli to narzędzie Ci pomaga, rozważ proszę wsparcie nas.",
                  "Konwertuj kolejny",
                  "Wesprzyj"
              ),
              "nl": (
                  "Je bestand wordt gedownload..",
                  "Als deze tool je helpt, overweeg dan om ons te steunen.",
                  "Nog een converteren",
                  "Doneren"
              ),
              "th": (
                  "ไฟล์ของคุณกำลังดาวน์โหลด..",
                  "หากเครื่องมือนี้เป็นประโยชน์ โปรดพิจารณาสนับสนุนเรา",
                  "แปลงไฟล์อื่น",
                  "บริจาค"
              ),
              "vi": (
                  "Tệp của bạn đang được tải xuống..",
                  "Nếu công cụ này giúp ích cho bạn, vui lòng cân nhắc ủng hộ chúng tôi.",
                  "Chuyển đổi tệp khác",
                  "Quyên góp"
              ),
              "ms": (
                  "Fail anda sedang dimuat turun..",
                  "Jika alat ini membantu anda, sila pertimbangkan untuk menyokong kami.",
                  "Tukar yang Lain",
                  "Derma"
              )
          }

          # 2. Map regional folder names to their base language based on your hreflang tags
          aliases = {
              # Arabic Regions
              "kw": "ar", # ar-KW
              "bh": "ar", # ar-BH
              "om": "ar", # ar-OM
              "jo": "ar", # ar-JO
              "ae": "ar", # ar-AE
              "qa": "ar", # ar-QA
              
              # English Regions
              "gb": "en", # en-GB
              "eu": "en", # en-150 (Europe)
              "us": "en", # en-US
              "ca": "en", # en-CA
              "au": "en", # en-AU
              "sg": "en"  # en-SG
          }

          A_JS = '<script src="/yt-ai/donation/a.js?v={{ site.github.build_revision }}"></script>'
          LANG_JS = '<script src="/yt-ai/donation/lang.js?v={{ site.github.build_revision }}"></script>'

          def b64(s):
              return base64.b64encode(s.encode("utf-8")).decode()

          for html in Path(".").rglob("index.html"):
              parts = html.parts

              if len(parts) == 1:
                  lang = "en" # Root index.html
              else:
                  lang = parts[0]
                  
                  # Map country folders to their base language
                  if lang in aliases:
                      lang = aliases[lang]
                      
                  # Fallback to English if language is missing
                  if lang not in translations:
                      lang = "en"

              title, text, convert, donate = translations[lang]

              inject = (
                  '<script>'
                  'window.downloadLang={'
                  f'title:atob("{b64(title)}"),'
                  f'text:atob("{b64(text)}"),'
                  f'convert:atob("{b64(convert)}"),'
                  f'donate:atob("{b64(donate)}")'
                  '};'
                  '</script>'
              )

              data = html.read_text(encoding="utf-8")

              # Remove previous injection safely
              data = re.sub(
                  r'<script>window\.downloadLang=.*?</script>',
                  '',
                  data,
                  flags=re.S
              )

              # Insert between a.js and lang.js (robust against newlines/spacing in HTML)
              pattern = r'(<script src="/yt-ai/donation/a\.js\?v=\{\{ site\.github\.build_revision \}\}"></script>)(.*?)(<script src="/yt-ai/donation/lang\.js\?v=\{\{ site\.github\.build_revision \}\}"></script>)'
              match = re.search(pattern, data, flags=re.S)
              
              if match:
                  data = data[:match.start()] + match.group(1) + "\n" + inject + "\n" + match.group(3) + data[match.end():]

              html.write_text(data, encoding="utf-8")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Inject download translations"
            git push
          fi
