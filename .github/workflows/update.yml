name: Comment Out Script Tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comment-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Comment out scripts in language index files
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          languages = [
              "ae", "ar", "au", "bh", "ca", "de", "en", "es", "eu",
              "fr", "gb", "hi", "id", "it", "ja", "jo", "ko", "kw",
              "ms", "nl", "om", "pl", "pt", "qa", "ru", "sg", "th",
              "tr", "us", "vi", "zh"
          ]

          script1 = (
              r'<script\s+async\s+src="'
              r'https://pl30765169\.effectivecpmnetwork\.com/32/e1/5f/'
              r'32e15f2082a75880a1c2e691c2bbf8db\.js'
              r'"\s*></script>'
          )

          script2 = (
              r'<script\s+async\s+src="'
              r'https://pl30765168\.effectivecpmnetwork\.com/44/3b/42/'
              r'443b42c34d2f923bcaedf407008b098c\.js'
              r'"\s*></script>'
          )

          total_updated = 0

          for lang in languages:
              file = Path(lang) / "index.html"

              if not file.exists():
                  print(f"Skipping missing file: {file}")
                  continue

              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError) as e:
                  print(f"Could not read {file}: {e}")
                  continue

              updated = text

              # Comment out script 1 if it is not already inside an HTML comment
              updated = re.sub(
                  rf'(?<!<!--\n)({script1})',
                  r'<!--\n\1\n-->',
                  updated,
                  flags=re.IGNORECASE
              )

              # Comment out script 2 if it is not already inside an HTML comment
              updated = re.sub(
                  rf'(?<!<!--\n)({script2})',
                  r'<!--\n\1\n-->',
                  updated,
                  flags=re.IGNORECASE
              )

              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  total_updated += 1
                  print(f"Updated: {file}")
              else:
                  print(f"No changes needed: {file}")

          print("----------------------------------------")
          print(f"Updated files: {total_updated}")
          print("----------------------------------------")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Comment out script tags" || echo "No changes"

      - name: Push changes
        run: git push
