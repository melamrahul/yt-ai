              ],
              "ru": [
                  "ÑÐ½Ð²Ð°Ñ€Ñ", "Ñ„ÐµÐ²Ñ€Ð°Ð»Ñ", "Ð¼Ð°Ñ€Ñ‚Ð°", "Ð°Ð¿Ñ€ÐµÐ»Ñ", "Ð¼Ð°Ñ", "Ð¸ÑŽÐ½Ñ",
                  "Ð¸ÑŽÐ»Ñ", "Ð°Ð²Ð³ÑƒÑÑ‚Ð°", "ÑÐµÐ½Ñ‚ÑÐ±Ñ€Ñ", "Ð¾ÐºÑ‚ÑÐ±Ñ€Ñ", "Ð½Ð¾ÑÐ±Ñ€Ñ", "Ð´ÐµÐºÐ°Ð±Ñ€Ñ"
