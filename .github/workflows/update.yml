          ]
          def localized_date(lang):
              year = now.year
              month = now.month
              day = now.day
              hour = now.hour
              minute = now.minute
              # Arabic
              if lang in {"ae", "ar", "qa"}:
                  return f"{day} {arabic_months[month - 1]} {year} â€“ {hour:02d}:{minute:02d}"
