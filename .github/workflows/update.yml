name: Restore Header Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore header logo
        shell: bash
        run: |
          set -e

          echo "Restoring header logo..."

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/workflows/*" \
            -exec sed -i \
            's@<div class="logo"></div>@<div class="logo"><img src="https://melamrahul.github.io/yt-ai/yt-ai-icon.png" /></div>@g' {} +

          echo "Header logo restored."

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Restore header logo"

      - name: Push changes
        shell: bash
        run: |
          set -e

          git fetch origin main
          git rebase origin/main
          git push origin main
