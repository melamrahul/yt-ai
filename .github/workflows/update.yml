name: Replace YT-AI Icon URL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-icon-url:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace old icon URL
        run: |
          OLD_URL="https://melamrahul.github.io/yt-ai/yt-ai-icon.png"
          NEW_URL="https://melamrahul.github.io/yt-ai/deps/icons/main-icon.png"

          find . \
            -type f \
            -not -path './.git/*' \
            -not -path './.github/workflows/*' \
            -print0 |
          xargs -0 grep -Il "$OLD_URL" |
          xargs -r sed -i "s|$OLD_URL|$NEW_URL|g"

      - name: Check for changes
        run: |
          git diff --stat
          git diff

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes found."
            exit 0
          fi

          git add .
          git commit -m "Replace YT-AI icon URL"
          git push
