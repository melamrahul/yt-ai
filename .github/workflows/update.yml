name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loader-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove global loader script
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          # Match complete script blocks.
          script_pattern = re.compile(
              r'<script\b[^>]*>.*?</script\s*>',
              re.IGNORECASE | re.DOTALL
          )

          total_files = 0
          total_scripts = 0

          # Search every HTML/HTM file in the repository.
          for file in Path(".").rglob("*"):

              if not file.is_file():
                  continue

              if file.suffix.lower() not in {".html", ".htm"}:
                  continue

              # Skip Git and dependency folders.
              if ".git" in file.parts or "node_modules" in file.parts:
                  continue

              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError) as e:
                  print(f"Skipping unreadable file: {file} - {e}")
                  continue

              removed_count = 0

              def remove_loader_script(match):
                  nonlocal removed_count

                  script = match.group(0)

                  # Remove only scripts containing globalLoader.
                  if "globalLoader" in script:
                      removed_count += 1
                      return ""

                  return script

              updated = script_pattern.sub(
                  remove_loader_script,
                  text
              )

              if removed_count > 0 and updated != text:
                  file.write_text(
                      updated,
                      encoding="utf-8"
                  )

                  total_files += 1
                  total_scripts += removed_count

                  print(
                      f"Updated: {file} "
                      f"(removed {removed_count} loader script(s))"
                  )

          print("----------------------------------------")
          print(f"HTML files updated: {total_files}")
          print(f"Loader scripts removed: {total_scripts}")
          print("----------------------------------------")
          PY

      - name: Check changes
        run: |
          echo "Files changed:"
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove global loader script"
          fi

      - name: Push changes
        run: git push
