              if lang == "pl":
                  return f"{day} {months['pl'][month - 1]} {year} â€“ {hour:02d}:{minute:02d}"
              # Russian
              if lang == "ru":
                  return f"{day} {months['ru'][month - 1]} {year} Ð³. â€“ {hour:02d}:{minute:02d}"
              # Portuguese
              if lang == "pt":
                  return f"{day} de {months['pt'][month - 1]} de {year} â€“ {hour:02d}:{minute:02d}"
              # Turkish
              if lang == "tr":
                  return f"{day} {months['tr'][month - 1]} {year} â€“ {hour:02d}:{minute:02d}"
              # Vietnamese
              if lang == "vi":
                  return f"{day} thÃ¡ng {month} nÄƒm {year} â€“ {hour:02d}:{minute:02d}"
              # English
              if lang in {"en", "au", "gb", "us", "ca", "bh", "sg", "kw", "jo"}:
                  return f"{months['en'][month - 1]} {day}, {year} â€“ {hour:02d}:{minute:02d}"
              # Other languages
              lang_months = months.get(lang, months["en"])
              return f"{day} {lang_months[month - 1]} {year} â€“ {hour:02d}:{minute:02d}"
          # Match only <time> elements that contain a datetime attribute.
          time_pattern = re.compile(
              r'(<time\b[^>]*\bdatetime\s*=\s*)["\'][^"\']*["\']([^>]*>)'
              r'.*?'
              r'(</time>)',
              re.IGNORECASE | re.DOTALL
          )
          total_updated = 0
          def process_file(file: Path, visible_date: str):
              global total_updated
              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  return
              file_updated = [False]
              def replace_time(match):
                  file_updated[0] = True
                  return (
                      f'{match.group(1)}"{datetime_value}"'
                      f'{match.group(2)}'
                      f'{visible_date}'
                      f'{match.group(3)}'
                  )
              updated = time_pattern.sub(replace_time, text)
              if file_updated[0] and updated != text:
                  file.write_text(updated, encoding="utf-8")
                  total_updated += 1
                  print(f"Updated: {file}")
          # Update language-folder pages
          for lang in languages:
              directory = Path(lang)
              if not directory.exists():
                  print(f"Skipping missing directory: {directory}")
                  continue
              visible_date = localized_date(lang)
              for file in directory.rglob("*"):
                  if not file.is_file():
                      continue
                  if file.suffix.lower() not in {
                      ".html", ".htm", ".xml", ".svg"
                  }:
                      continue
                  process_file(file, visible_date)
          # Update root-level pages (English date formatting)
          root_visible_date = localized_date("en")
          for root_file in root_files:
              file = Path(root_file)
              if not file.exists():
                  print(f"Skipping missing root file: {file}")
                  continue
              process_file(file, root_visible_date)
          print("----------------------------------------")
          print(f"Updated files: {total_updated}")
          print(f"IST datetime: {datetime_value}")
          print(f"IST time: {now.strftime('%H:%M')}")
          print("----------------------------------------")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update" || echo "No changes"
      - name: Push changes
        run: git push
