name: Update Ad Codes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace Ad Codes
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          # The new code block to insert
          new_ad_code = (
              '<script data-cfasync="false" src="https://bauval.org/14/32e15f2082a75880a1c2e691c2bbf8db"></script>\n'
              '<script data-cfasync="false" src="https://abscloud.org/1/443b42c34d2f923bcaedf407008b098c"></script>\n'
              '<script async="async" data-cfasync="false" src="https://bauval.org/21/94bab3782cb7532f2a5ee2c403f6d27d"></script>\n'
              '<div id="container-94bab3782cb7532f2a5ee2c403f6d27d"></div>'
          )

          # Pattern to find ANY of the old elements (flexible with attributes/whitespace)
          combined_pattern = re.compile(
              r'<script[^>]*src="https://pl30765169\.effectivecpmnetwork\.com/32/e1/5f/32e15f2082a75880a1c2e691c2bbf8db\.js"[^>]*></script>\s*|'
              r'<script[^>]*src="https://pl30765168\.effectivecpmnetwork\.com/44/3b/42/443b42c34d2f923bcaedf407008b098c\.js"[^>]*></script>\s*|'
              r'<script[^>]*src="https://pl31033916\.profitableratecpmnetwork\.com/94bab3782cb7532f2a5ee2c403f6d27d/invoke\.js"[^>]*></script>\s*|'
              r'<div\s*id="container-94bab3782cb7532f2a5ee2c403f6d27d"\s*></div>\s*',
              re.IGNORECASE
          )

          # Individual patterns to clean up any remaining old elements after the first replacement
          patterns_to_remove = [
              re.compile(r'<script[^>]*src="https://pl30765169\.effectivecpmnetwork\.com/32/e1/5f/32e15f2082a75880a1c2e691c2bbf8db\.js"[^>]*></script>\s*', re.IGNORECASE),
              re.compile(r'<script[^>]*src="https://pl30765168\.effectivecpmnetwork\.com/44/3b/42/443b42c34d2f923bcaedf407008b098c\.js"[^>]*></script>\s*', re.IGNORECASE),
              re.compile(r'<script[^>]*src="https://pl31033916\.profitableratecpmnetwork\.com/94bab3782cb7532f2a5ee2c403f6d27d/invoke\.js"[^>]*></script>\s*', re.IGNORECASE),
              re.compile(r'<div\s*id="container-94bab3782cb7532f2a5ee2c403f6d27d"\s*></div>\s*', re.IGNORECASE)
          ]

          total_updated = 0

          # Gather all files to process
          files_to_process = []
          for lang in ["de", "en", "es", "fr", "ja", "pt", "zh"]:
              directory = Path("leaf") / lang
              if directory.exists():
                  for file in directory.rglob("*"):
                      if file.is_file() and file.suffix.lower() in {".html", ".htm", ".xml", ".svg"}:
                          files_to_process.append(file)

          for file in [Path("index.html"), Path("youtube-to-mp3-converter-github.html"), Path("youtube-video-to-mp3-converter-github.html")]:
              if file.is_file():
                  files_to_process.append(file)

          # Process each file
          for file in files_to_process:
              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              
              original_text = text
              matches = list(combined_pattern.finditer(text))
              
              if matches:
                  # 1. Replace the FIRST old element found with the new complete block
                  first_match = matches[0]
                  text = text[:first_match.start()] + new_ad_code + text[first_match.end():]
                  
                  # 2. Remove any other scattered old elements
                  for pattern in patterns_to_remove:
                      text = pattern.sub('', text)
                  
                  # 3. Save if changed
                  if text != original_text:
                      file.write_text(text, encoding="utf-8")
                      total_updated += 1
                      print(f"Updated: {file}")

          print("----------------------------------------")
          print(f"Total files updated: {total_updated}")
          print("----------------------------------------")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update ad codes" || echo "No changes"
          
      - name: Push changes
        run: git push
