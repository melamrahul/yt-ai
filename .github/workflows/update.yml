name: Update

# Working Update Date and Time Code and comment
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update
        run: |
          python3 <<'PY'
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          # ============================================================
          # CURRENT DATE/TIME IN INDIA (IST)
          # ============================================================

          now = datetime.now(ZoneInfo("Asia/Kolkata"))

          # Example: 2026-08-27T16:37
          datetime_value = now.strftime("%Y-%m-%dT%H:%M")


          # ============================================================
          # LANGUAGE FOLDERS
          # ============================================================

          languages = [
              "ae", "ar", "au", "bh", "ca", "de", "en", "es", "eu",
              "fr", "gb", "hi", "id", "it", "ja", "jo", "ko", "kw",
              "ms", "nl", "om", "pl", "pt", "qa", "ru", "sg", "th",
              "tr", "us", "vi", "zh"
          ]


          # ============================================================
          # MONTH NAMES
          # ============================================================

          months = {
              "en": [
                  "January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"
              ],

              "de": [
                  "Januar", "Februar", "März", "April", "Mai", "Juni",
                  "Juli", "August", "September", "Oktober", "November", "Dezember"
              ],

              "es": [
                  "enero", "febrero", "marzo", "abril", "mayo", "junio",
                  "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
              ],

              "eu": [
                  "urtarrila", "otsaila", "martxoa", "apirila", "maiatza", "ekaina",
                  "uztaila", "abuztua", "iraila", "urria", "azaroa", "abendua"
              ],

              "fr": [
                  "janvier", "février", "mars", "avril", "mai", "juin",
                  "juillet", "août", "septembre", "octobre", "novembre", "décembre"
              ],

              "it": [
                  "gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
                  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"
              ],

              "nl": [
                  "januari", "februari", "maart", "april", "mei", "juni",
                  "juli", "augustus", "september", "oktober", "november", "december"
              ],

              "pl": [
                  "stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca",
                  "lipca", "sierpnia", "września", "października", "listopada", "grudnia"
              ],

              "pt": [
                  "janeiro", "fevereiro", "março", "abril", "maio", "junho",
                  "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
              ],

              "ru": [
                  "января", "февраля", "марта", "апреля", "мая", "июня",
                  "июля", "августа", "сентября", "октября", "ноября", "декабря"
              ],

              "tr": [
                  "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",
                  "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"
              ],

              "id": [
                  "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                  "Juli", "Agustus", "September", "Oktober", "November", "Desember"
              ],

              "ms": [
                  "Januari", "Februari", "Mac", "April", "Mei", "Jun",
                  "Julai", "Ogos", "September", "Oktober", "November", "Disember"
              ]
          }


          # ============================================================
          # ARABIC MONTHS
          # ============================================================

          arabic_months = [
              "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
              "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
          ]


          # ============================================================
          # HINDI MONTHS
          # ============================================================

          hindi_months = [
              "जनवरी", "फ़रवरी", "मार्च", "अप्रैल", "मई", "जून",
              "जुलाई", "अगस्त", "सितंबर", "अक्टूबर", "नवंबर", "दिसंबर"
          ]


          # ============================================================
          # THAI MONTHS
          # ============================================================

          thai_months = [
              "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน",
              "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม",
              "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
          ]


          # ============================================================
          # LOCALIZED DATE
          # ============================================================

          def localized_date(lang):
              year = now.year
              month = now.month
              day = now.day
              hour = now.hour
              minute = now.minute

              # Arabic
              if lang in {"ae", "ar", "qa"}:
                  return (
                      f"{day} {arabic_months[month - 1]} {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Hindi
              if lang == "hi":
                  return (
                      f"{day} {hindi_months[month - 1]} {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Japanese
              if lang == "ja":
                  return (
                      f"{year}年{month}月{day}日 – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Korean
              if lang == "ko":
                  return (
                      f"{year}년 {month}월 {day}일 – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Chinese
              if lang == "zh":
                  return (
                      f"{year}年{month}月{day}日 – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Thai
              if lang == "th":
                  return (
                      f"{day} {thai_months[month - 1]} {year + 543} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Basque
              if lang == "eu":
                  return (
                      f"{year}ko {months['eu'][month - 1]} {day} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Polish
              if lang == "pl":
                  return (
                      f"{day} {months['pl'][month - 1]} {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Russian
              if lang == "ru":
                  return (
                      f"{day} {months['ru'][month - 1]} {year} г. – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Portuguese
              if lang == "pt":
                  return (
                      f"{day} de {months['pt'][month - 1]} de {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Turkish
              if lang == "tr":
                  return (
                      f"{day} {months['tr'][month - 1]} {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Vietnamese
              if lang == "vi":
                  return (
                      f"{year} tháng {month} năm {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # English
              if lang in {
                  "en", "au", "gb", "us", "ca",
                  "bh", "sg", "kw", "jo"
              }:
                  return (
                      f"{months['en'][month - 1]} {day}, {year} – "
                      f"{hour:02d}:{minute:02d}"
                  )

              # Other languages
              lang_months = months.get(lang, months["en"])

              return (
                  f"{day} {lang_months[month - 1]} {year} – "
                  f"{hour:02d}:{minute:02d}"
              )


          # ============================================================
          # UPDATE <time datetime="...">...</time>
          # ============================================================

          time_pattern = re.compile(
              r'(<time\b[^>]*\bdatetime\s*=\s*)["\'][^"\']*["\']([^>]*>)'
              r'.*?'
              r'(</time>)',
              re.IGNORECASE | re.DOTALL
          )

          total_updated = 0

          for lang in languages:
              directory = Path(lang)

              if not directory.exists():
                  print(f"Skipping missing directory: {directory}")
                  continue

              visible_date = localized_date(lang)

              for file in directory.rglob("*"):

                  if not file.is_file():
                      continue

                  if file.suffix.lower() not in {
                      ".html",
                      ".htm",
                      ".xml",
                      ".svg"
                  }:
                      continue

                  try:
                      text = file.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue

                  file_updated = [False]

                  def replace_time(match):
                      file_updated[0] = True

                      return (
                          f'{match.group(1)}"{datetime_value}"'
                          f'{match.group(2)}'
                          f'{visible_date}'
                          f'{match.group(3)}'
                      )

                  updated = time_pattern.sub(
                      replace_time,
                      text
                  )

                  if file_updated[0] and updated != text:
                      file.write_text(
                          updated,
                          encoding="utf-8"
                      )

                      total_updated += 1

                      print(
                          f"Updated time: {file}"
                      )


          # ============================================================
          # COMMENT OUT AD SCRIPTS FROM ALL index.html FILES
          # ============================================================

          ad_scripts = [
              '<script async src="https://pl30765169.effectivecpmnetwork.com/32/e1/5f/32e15f2082a75880a1c2e691c2bbf8db.js"></script>',

              '<script async src="https://pl30765168.effectivecpmnetwork.com/44/3b/42/443b42c34d2f923bcaedf407008b098c.js"></script>'
          ]


          ad_files_updated = 0
          ad_scripts_commented = 0


          # Match HTML comments containing either of the scripts.
          comment_pattern = re.compile(
              r'<!--\s*'
              r'(?:'
              + "|".join(re.escape(script) for script in ad_scripts)
              + r')'
              r'\s*-->',
              re.IGNORECASE
          )


          for lang in languages:

              directory = Path(lang)

              if not directory.exists():
                  continue

              # Find every index.html recursively.
              for file in directory.rglob("index.html"):

                  if not file.is_file():
                      continue

                  try:
                      text = file.read_text(
                          encoding="utf-8"
                      )
                  except (UnicodeDecodeError, OSError):
                      continue

                  original = text


                  # ----------------------------------------------------
                  # Temporarily protect already-commented scripts
                  # ----------------------------------------------------

                  protected = []

                  def protect_comment(match):
                      protected.append(match.group(0))
                      return f"__AD_SCRIPT_COMMENT_{len(protected) - 1}__"

                  text = comment_pattern.sub(
                      protect_comment,
                      text
                  )


                  # ----------------------------------------------------
                  # Comment out both scripts
                  # ----------------------------------------------------

                  for script in ad_scripts:

                      pattern = re.compile(
                          re.escape(script),
                          re.IGNORECASE
                      )

                      def comment_script(match):
                          nonlocal ad_scripts_commented

                          ad_scripts_commented += 1

                          return (
                              "<!-- "
                              + match.group(0)
                              + " -->"
                          )

                      text = pattern.sub(
                          comment_script,
                          text
                      )


                  # ----------------------------------------------------
                  # Restore already-commented scripts
                  # ----------------------------------------------------

                  for index, comment in enumerate(protected):
                      text = text.replace(
                          f"__AD_SCRIPT_COMMENT_{index}__",
                          comment
                      )


                  # ----------------------------------------------------
                  # Write changes
                  # ----------------------------------------------------

                  if text != original:

                      file.write_text(
                          text,
                          encoding="utf-8"
                      )

                      ad_files_updated += 1

                      print(
                          f"Commented ad scripts: {file}"
                      )


          # ============================================================
          # SUMMARY
          # ============================================================

          print("----------------------------------------")
          print(f"Updated time files: {total_updated}")
          print(
              f"index.html files changed: {ad_files_updated}"
          )
          print(
              f"Ad script tags commented: {ad_scripts_commented}"
          )
          print(
              f"IST datetime: {datetime_value}"
          )
          print(
              f"IST time: {now.strftime('%H:%M')}"
          )
          print("----------------------------------------")
          PY


      # ================================================================
      # COMMIT CHANGES
      # ================================================================

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Update" || echo "No changes"


      # ================================================================
      # PUSH CHANGES
      # ================================================================

      - name: Push changes
        run: |
          git push
