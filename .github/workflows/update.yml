name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          adsense_script = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3081429485965110" crossorigin="anonymous"></script>'

          languages = [
              "ae", "ar", "au", "bh", "ca", "de", "en", "es", "eu",
              "fr", "gb", "hi", "id", "it", "ja", "jo", "ko", "kw",
              "ms", "nl", "om", "pl", "pt", "qa", "ru", "sg", "th",
              "tr", "us", "vi", "zh"
          ]

          total_updated = 0

          for lang in languages:
              directory = Path(lang)

              if not directory.exists():
                  print(f"Skipping missing directory: {directory}")
                  continue

              for file in directory.rglob("*"):
                  if not file.is_file():
                      continue

                  if file.suffix.lower() not in {".html", ".htm", ".xml", ".svg"}:
                      continue

                  try:
                      text = file.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError) as error:
                      print(f"Skipping {file}: {error}")
                      continue

                  # Do not add the script if it already exists.
                  if adsense_script in text:
                      continue

                  # Add AdSense immediately after the opening <head> tag.
                  updated = re.sub(
                      r"(<head\b[^>]*>)",
                      rf"\1\n{adsense_script}",
                      text,
                      count=1,
                      flags=re.IGNORECASE
                  )

                  if updated != text:
                      file.write_text(updated, encoding="utf-8")
                      total_updated += 1
                      print(f"Updated: {file}")

          print("----------------------------------------")
          print(f"Updated files: {total_updated}")
          print("----------------------------------------")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update"
            git push
          fi
