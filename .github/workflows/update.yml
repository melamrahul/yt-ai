name: Update Performance Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-performance-fixes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Performance Fixes to All HTML Files
        run: |
          python3 << 'EOF'
          import os
          import re

          # Walk through all directories and files in the repository
          for root, dirs, files in os.walk('.'):
              # Skip the .git directory
              if '.git' in root:
                  continue

              for file in files:
                  if file.endswith('.html'):
                      filepath = os.path.join(root, file)

                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()

                          original_content = content

                          # 1. Add Preconnect & DNS-Prefetch before </head>
                          if '<link rel="preconnect" href="https://mr.ruvs.in"' not in content:
                              preconnect_block = """<link rel="preconnect" href="https://mr.ruvs.in" crossorigin>
          <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
          <link rel="preconnect" href="https://www.ruvs.in" crossorigin>
          <link rel="dns-prefetch" href="https://pl30765169.effectivecpmnetwork.com">
          <link rel="dns-prefetch" href="https://pl31033916.profitableratecpmnetwork.com">
          </head>"""

                              content = content.replace('</head>', preconnect_block)

                          # 2. Update Iframe:
                          # ONLY change loading="eager" to loading="lazy"
                          if 'loading="eager"' in content:
                              content = content.replace(
                                  'loading="eager"',
                                  'loading="lazy"'
                              )

                          # 3. Add async to ad/tracking network scripts
                          # Prevents render-blocking
                          content = re.sub(
                              r'(<script)\s+'
                              r'(src="https://pl\d+\.(?:effectivecpmnetwork|profitableratecpmnetwork)\.com/[^"]+")',
                              r'\1 async \2',
                              content
                          )

                          # Clean up redundant async="async"
                          content = content.replace(
                              'async="async"',
                              'async'
                          )

                          # 4. Add Global Loader Timeout before </body>
                          # Prevents infinite spinning
                          if (
                              'globalLoader' in content
                              and 'setTimeout(function()' not in content
                          ):
                              loader_script = """<script>
          // Force hide the global loader after 2.5 seconds
          // to prevent infinite spinning
          setTimeout(function() {
              const loader = document.getElementById('globalLoader');

              if (loader) {
                  loader.style.display = 'none';
                  document.body.style.overflow = 'auto';
              }
          }, 2500);

          // Also hide it immediately when the HTML is ready
          document.addEventListener('DOMContentLoaded', function() {
              const loader = document.getElementById('globalLoader');

              if (loader) {
                  loader.style.display = 'none';
              }
          });
          </script>
          </body>"""

                              content = content.replace(
                                  '</body>',
                                  loader_script
                              )

                          # Write back only if changes were made
                          if content != original_content:
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(content)

                              print(f"✅ Updated: {filepath}")
                          else:
                              print(f"⏭️ Skipped (no changes needed): {filepath}")

                      except Exception as e:
                          print(f"❌ Error processing {filepath}: {e}")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit \
            -m "chore: apply performance fixes to all HTML files (lazy iframe, async scripts, preconnect, loader timeout)" \
            || echo "No changes to commit"

      - name: Push changes
        run: git push
