name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loader-script:
    runs-on: ubuntu-latest

    steps:
      - name: Update
        uses: actions/checkout@v4

      - name: Update
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          # Matches the global loader script even if:
          # - the two comment lines are present or already removed
          # - whitespace/line breaks differ
          # - script has additional attributes such as type="text/javascript"
          script_pattern = re.compile(
              r'<script\b[^>]*>\s*'
              r'(?:(?://\s*Force\s+hide\s+the\s+global\s+loader\s+after\s+2\.5\s+seconds\s*'
              r'//\s*to\s+prevent\s+infinite\s+spinning\s*)?)'
              r'setTimeout\s*\(\s*function\s*\(\s*\)\s*\{\s*'
              r'const\s+loader\s*=\s*document\.getElementById\s*\(\s*[\'"]globalLoader[\'"]\s*\)\s*;?\s*'
              r'if\s*\(\s*loader\s*\)\s*\{\s*'
              r'loader\.style\.display\s*=\s*[\'"]none[\'"]\s*;?\s*'
              r'document\.body\.style\.overflow\s*=\s*[\'"]auto[\'"]\s*;?\s*'
              r'\}\s*'
              r'\}\s*,\s*2500\s*\)\s*;?\s*'
              r'document\.addEventListener\s*\(\s*[\'"]DOMContentLoaded[\'"]\s*,\s*function\s*\(\s*\)\s*\{\s*'
              r'(?:(?:const|let|var)\s+loader\s*=\s*document\.getElementById\s*\(\s*[\'"]globalLoader[\'"]\s*\)\s*;?\s*'
              r'if\s*\(\s*loader\s*\)\s*\{\s*'
              r'loader\.style\.display\s*=\s*[\'"]none[\'"]\s*;?\s*'
              r'\}\s*)'
              r'\}\s*\)\s*;?\s*'
              r'</script>',
              re.IGNORECASE | re.DOTALL
          )

          # Search the entire repository for HTML pages.
          html_files = list(Path(".").rglob("*.html")) + list(Path(".").rglob("*.htm"))

          total_files = 0
          total_scripts = 0

          for file in html_files:

              # Skip Git metadata and dependency directories.
              if any(part in {".git", "node_modules"} for part in file.parts):
                  continue

              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  print(f"Skipping unreadable file: {file}")
                  continue

              updated, count = script_pattern.subn("", text)

              if count > 0 and updated != text:
                  file.write_text(updated, encoding="utf-8")

                  total_files += 1
                  total_scripts += count

                  print(f"Removed {count} loader script(s): {file}")

          print("----------------------------------------")
          print(f"HTML files updated: {total_files}")
          print(f"Loader scripts removed: {total_scripts}")
          print("----------------------------------------")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Update" || echo "No changes"

      - name: Push changes
        run: git push
