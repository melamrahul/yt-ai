name: Uncomment Ad Scripts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uncomment-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Uncomment specific script tags
        env:
          PYTHON_SCRIPT: |
            import re
            from pathlib import Path

            # Targeted regex to find HTML comments containing ONLY these specific script tags
            # It safely ignores other comments and handles multi-line formatting.
            pattern = re.compile(
                r'<!--\s*'
                r'((?:<script[^>]*src=["\']https://(?:pl30765169\.effectivecpmnetwork\.com|pl30765168\.effectivecpmnetwork\.com|pl31033916\.profitableratecpmnetwork\.com)/[^"\']*["\'][^>]*></script>\s*)+)'
                r'\s*-->',
                re.IGNORECASE
            )

            def uncomment_scripts(text):
                def replacer(match):
                    # Return only the captured script tags, effectively stripping <!-- and -->
                    return match.group(1)
                return pattern.sub(replacer, text)

            total_updated = 0
            files_checked = 0

            # Traverse all files in the repository
            for file in Path(".").rglob("*"):
                if not file.is_file():
                    continue
                
                # Only process HTML files
                if file.suffix.lower() not in {".html", ".htm"}:
                    continue
                
                files_checked += 1
                try:
                    text = file.read_text(encoding="utf-8")
                except (UnicodeDecodeError, OSError):
                    continue

                updated_text = uncomment_scripts(text)

                if updated_text != text:
                    file.write_text(updated_text, encoding="utf-8")
                    total_updated += 1
                    print(f"Updated: {file}")

            print("----------------------------------------")
            print(f"Files checked: {files_checked}")
            print(f"Updated files: {total_updated}")
            print("----------------------------------------")
        
        run: |
          echo "$PYTHON_SCRIPT" > uncomment_scripts.py
          python3 uncomment_scripts.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Uncomment ad network script tags" || echo "No changes to commit"

      - name: Push changes
        run: git push
