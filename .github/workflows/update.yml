name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update
        run: |
          find . -type f \( -name "*.html" -o -name "*.json" -o -name "*.xml" \) | while read file; do
            sed -i 's#<script src="https://www.ruvs.in/resos/common/scripts/sentinel.js?v=1.18" defer></script>#<script src="https://www.ruvs.in/resos/react/sentinel.js?v=1.0.0" defer></script>#g' "$file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update" || echo "No changes"

      - name: Push changes
        run: git push
