name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Update trailing slashes in meta tags  
        run: |  
          echo "" | base64 -d > update_links.py  
          python3 update_links.py  

      - name: Commit changes  
        run: |  
          git config user.name "github-actions[bot]"  
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  
          git add .  
          git commit -m "Add trailing slashes to alternate and canonical links" || echo "No changes"  

      - name: Push changes  
        run: git push
