name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-loader-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove global loader script
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          # Match complete <script>...</script> blocks.
          script_pattern = re.compile(
              r'<script\b[^>]*>.*?</script\s*>',
              re.IGNORECASE | re.DOTALL
          )

          total_files = 0
          total_scripts = 0
          total_html_files = 0

          # Search the entire repository.
          for file in Path(".").rglob("*"):

              if not file.is_file():
                  continue

              # Only process HTML files.
              if file.suffix.lower() not in {".html", ".htm"}:
                  continue

              # Never process these directories.
              if ".git" in file.parts or "node_modules" in file.parts:
                  continue

              total_html_files += 1

              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError) as e:
                  print(f"Skipping unreadable file: {file} - {e}")
                  continue

              # Find all script blocks in this HTML file.
              matches = list(script_pattern.finditer(text))

              if not matches:
                  continue

              updated = text
              removed_count = 0

              # Process from the end so string positions remain valid.
              for match in reversed(matches):
                  script = match.group(0)

                  # Remove only scripts containing globalLoader.
                  if "globalLoader" in script:
                      updated = (
                          updated[:match.start()]
                          + updated[match.end():]
                      )

                      removed_count += 1

              # Write only if something was actually removed.
              if removed_count > 0 and updated != text:
                  file.write_text(updated, encoding="utf-8")

                  total_files += 1
                  total_scripts += removed_count

                  print(
                      f"Updated: {file} "
                      f"(removed {removed_count} loader script(s))"
                  )

          print()
          print("========================================")
          print(f"HTML files found: {total_html_files}")
          print(f"HTML files updated: {total_files}")
          print(f"Loader scripts removed: {total_scripts}")
          print("========================================")

      - name: Check changes
        run: |
          echo "Git changes:"
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove global loader script"
          fi

      - name: Push changes
        run: |
          git push
