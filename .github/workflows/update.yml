name: Update

on:
  workflow_dispatch:

jobs:
  update-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update
        run: |
          find . -type f \( -name "*.html" -o -name "*.json" -o -name "*.xml" \) | while read file; do
            sed -i 's/2026-07-23T13:10:00+05:30/2026-08-05T12:00:00+05:30/g' "$file"
            sed -i 's/"dateModified":"2026-07-23"/"dateModified":"2026-08-05"/g' "$file"
            sed -i 's/2026-07-23T16:10/2026-08-05T12:00/g' "$file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update modified dates" || echo "No changes"

      - name: Push changes
        run: git push
