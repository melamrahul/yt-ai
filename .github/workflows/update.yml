name: Update

on:
  schedule:
    - cron: '0 6 * * *'   # daily check; guard enforces >= 96h between real updates
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 4-day gap"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: homepage-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check 4-day gap
        id: guard
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('.github/state/cycle.json')).get('history',[])))" 2>/dev/null || echo 0)
          LAST=$(git log -1 --format=%ct -- .github/state/cycle.json 2>/dev/null || echo 0)
          NOW=$(date +%s)
          HOURS=$(( (NOW - LAST) / 3600 ))
          if [ "$FORCE" = "true" ] || [ "$COUNT" -eq 0 ] || [ "$HOURS" -ge 96 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only ${HOURS}h since last update. Skipping."
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply next content update
        if: steps.guard.outputs.skip == 'false'
        run: python .github/scripts/update.py

      - name: Commit and push as melamrahul
        if: steps.guard.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.COMMIT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "melamrahul"
          git config user.email "138295694+melamrahul@users.noreply.github.com"
          git add index.html .github/state/cycle.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -F /tmp/commit_msg
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${GITHUB_REF_NAME}
