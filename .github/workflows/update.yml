name: Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Time and Ad Codes
        run: |
          python3 <<'PY'
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          datetime_value = now.strftime("%Y-%m-%dT%H:%M")
          
          languages = ["de", "en", "es", "fr", "ja", "pt", "zh"]
          
          months = {
              "en": ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
              "de": ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"],
              "es": ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"],
              "fr": ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"],
              "pt": ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"]
          }
          
          def localized_date(lang):
              year, month, day, hour, minute = now.year, now.month, now.day, now.hour, now.minute
              if lang in {"ja", "zh"}:
                  return f"{year}年{month}月{day}日 – {hour:02d}:{minute:02d}"
              if lang in months:
                  return f"{day} {months[lang][month - 1]} {year} – {hour:02d}:{minute:02d}"
              return f"{months['en'][month - 1]} {day}, {year} – {hour:02d}:{minute:02d}"
          
          time_pattern = re.compile(
              r'(<time\b[^>]*\bdatetime\s*=\s*)["\'][^"\']*["\']([^>]*>).*?(</time>)',
              re.IGNORECASE | re.DOTALL
          )
          
          old_ad_pattern = re.compile(
              r'<script[^>]*src="https://pl30765169\.effectivecpmnetwork\.com/32/e1/5f/32e15f2082a75880a1c2e691c2bbf8db\.js"[^>]*></script>\s*'
              r'<script[^>]*src="https://pl30765168\.effectivecpmnetwork\.com/44/3b/42/443b42c34d2f923bcaedf407008b098c\.js"[^>]*></script>\s*'
              r'<script[^>]*src="https://pl31033916\.profitableratecpmnetwork\.com/94bab3782cb7532f2a5ee2c403f6d27d/invoke\.js"[^>]*></script>\s*<div\s+id="container-94bab3782cb7532f2a5ee2c403f6d27d"></div>',
              re.IGNORECASE | re.DOTALL
          )
          
          # YAML-safe string concatenation to avoid indentation parsing errors
          new_ad_code = (
              '<script data-cfasync="false" src="https://bauval.org/14/32e15f2082a75880a1c2e691c2bbf8db"></script>\n'
              '<script data-cfasync="false" src="https://abscloud.org/1/443b42c34d2f923bcaedf407008b098c"></script>\n'
              '<script async="async" data-cfasync="false" src="https://bauval.org/21/94bab3782cb7532f2a5ee2c403f6d27d"></script>\n'
              '<div id="container-94bab3782cb7532f2a5ee2c403f6d27d"></div>'
          )

          total_updated = 0
          
          for lang in languages:
              directory = Path("leaf") / lang
              if not directory.exists():
                  print(f"Skipping missing directory: {directory}")
                  continue
              
              visible_date = localized_date(lang)
              for file in directory.rglob("*"):
                  if not file.is_file() or file.suffix.lower() not in {".html", ".htm", ".xml", ".svg"}:
                      continue
                  
                  try:
                      text = file.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  
                  original_text = text
                  
                  def replace_time(match, vd=visible_date, dv=datetime_value):
                      return f'{match.group(1)}"{dv}"{match.group(2)}{vd}{match.group(3)}'
                  
                  text = time_pattern.sub(replace_time, text)
                  text = old_ad_pattern.sub(new_ad_code, text)
                  
                  if text != original_text:
                      file.write_text(text, encoding="utf-8")
                      total_updated += 1
                      print(f"Updated: {file}")
          
          root_files = [
              Path("index.html"),
              Path("youtube-to-mp3-converter-github.html"),
              Path("youtube-video-to-mp3-converter-github.html")
          ]
          for file in root_files:
              if file.is_file():
                  original_text = file.read_text(encoding="utf-8")
                  visible_date = localized_date("en")
                  
                  def replace_time_root(match, vd=visible_date, dv=datetime_value):
                      return f'{match.group(1)}"{dv}"{match.group(2)}{vd}{match.group(3)}'
                  
                  text = time_pattern.sub(replace_time_root, original_text)
                  text = old_ad_pattern.sub(new_ad_code, text)
                  
                  if text != original_text:
                      file.write_text(text, encoding="utf-8")
                      total_updated += 1
                      print(f"Updated: {file}")

          print("---------------------------------------")
          print(f"Total files updated: {total_updated}")
          print(f"IST datetime: {datetime_value}")
          print("----------------------------------------")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update time and ad codes" || echo "No changes"
      - name: Push changes
        run: git push
